  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 999999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #app-loader.app-loader--hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #app-loader .app-loader__spinner {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid rgba(111, 23, 179, 0.2);
      border-top-color: rgb(111, 23, 179);
      animation: app-loader-spin 0.8s linear infinite;
    }

    @keyframes app-loader-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-loader" aria-hidden="true">
    <div class="app-loader__spinner"></div>
  </div>

  <app-root></app-root>

   <iframe
    id="chatbot-iframe"
    title="Chatbot"
    src="https://chatbot.svdpixel.com"
    frameborder="0">
  </iframe>

  <script>
    window.addEventListener('message', function (e) {
      var iframe = document.getElementById('chatbot-iframe');
      if (e.data === 'chat-open') {
        iframe.classList.add('chatbot-iframe--open');
      }
      if (e.data === 'chat-closed') {
        iframe.classList.remove('chatbot-iframe--open');
      }
    });
  </script>
</body>
</html>
